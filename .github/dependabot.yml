version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      major-updates:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      major-updates:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /ui
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      major-updates:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: docker
    directory: /deploy
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      major-updates:
        patterns: ["*"]
        update-types: [major]
