# Server config for the try-it stack. See ../config.example.yaml for a real one.
server:
  base_url: http://localhost:8020

db:
  url: postgresql+psycopg://evalkit:evalkit@postgres/evalkit
  migrate_on_start: true

blob:
  url: file:///data/evalkit

cost_map:
  source: bundled

allow_private_endpoints: true # your LLM may run on this machine (host.docker.internal)

encryption_key: env:EVALKIT_ENCRYPTION_KEY # seals the LLM provider key the setup service stores
