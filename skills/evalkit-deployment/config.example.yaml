server:
  base_url: https://evalkit.internal # used in links the CLI prints; `evalkit serve` binds its port unless --port is given (8020 when it has none)

db:
  url: env:EVALKIT_DATABASE_URL # Postgres: users, workspaces, agents, cases, experiments, scores
  # migrate_on_start: true # run `evalkit db upgrade` at startup (default false); see references/config-and-deploy.md
  # pool_size: 20 # connections the server keeps open to Postgres (default 20)
  # max_overflow: 10 # extra connections opened under load (default 10)
  # pool_timeout_seconds: 5 # a request that waits this long for a connection gets 503 + Retry-After (default 5)
  # keep (pool_size + max_overflow) x server replicas well under Postgres max_connections, with room for migrations and psql

blob:
  url: s3://client-bucket/evalkit # or file:///data/evalkit

cost_map:
  source: bundled # or a path/URL override

auth:
  token_ttl_hours: 720 # password login tokens
  # password_login: admin # with oidc set: admin (default), all or none (needs admin_claim); ignored without oidc
  # oidc: # single sign-on through an OIDC identity provider; see evalkit-docs/sso.md
  #   issuer: https://id.example.com # discovery at <issuer>/.well-known/openid-configuration
  #   client_id: 0oa1b2c3d4e5f6g7h8 # the web UI's public client, and the CLI's unless cli_client_id is set; no secret
  #   cli_client_id: null # evalkit login's own public client; set it when the IdP skips approval for the web client
  #   audience: https://evalkit.example.com # what the IdP puts in access tokens' aud for evalkit
  #   name: Okta # the login button's label
  #   scopes: [openid, profile, email, offline_access] # default
  #   authorize_params: {} # extra authorize-request parameters, e.g. {resource: https://evalkit.example.com} or {audience: ...}
  #   algorithms: [RS256] # default
  #   required_scopes: [] # scopes every IdP access token must carry; list them in scopes too
  #   admin_claim: {name: roles, value: evalkit-admin} # admin flag set from this claim at each sign-in

otel: # optional block; the OTLP collector at /api/otel/v1/traces
  settle_seconds: 10 # a session is settled when its newest span arrived longer ago than this
  max_batch_bytes: 16777216 # one export request; 413 beyond it
  max_session_bytes: 402653184 # span attributes one session read loads; 413 beyond it (size with the server's memory)
  import_page_traces: 25 # traces per request to a trace source during an import (size with the server's memory)

runner: # optional block; server runs
  evaluation_concurrency: 16 # runs scored at once; also the most a request may ask for (each holds a DB connection while it saves)

limits: # optional block; request body caps, 413 beyond them
  fixture_upload_bytes: 524288000 # one fixture file uploaded by evalkit sync (500 MB)
  experiment_blob_bytes: 524288000 # one trajectory or artifact written by a local run (500 MB)
  case_upload_bytes: 52428800 # the case YAML files of one evalkit sync or lint (50 MB)
  request_bytes: 10485760 # any other request body (10 MB); the collector uses otel.max_batch_bytes

# sentry: # optional; report server errors to Sentry
#   dsn: env:SENTRY_DSN
#   environment: production
#   traces_sample_rate: 0.0 # share of requests traced for performance (0.0-1.0)
#   max_request_body_size: never # request bodies attached to events: never, small (1 KB), medium (10 KB), always; bodies can hold client case data

encryption_key: env:EVALKIT_ENCRYPTION_KEY # Fernet key; encrypts the API keys of agents, remote evaluators, LLM providers and trace sources; the server refuses to start without it once any exist

# allow_private_endpoints: true # let agents, evaluators, LLM providers and trace sources point at loopback, private or link-local addresses (default false); set it when they run in the same cluster or on host.docker.internal
# trusted_endpoints: ["http://litellm:4000"] # URLs whose scheme, host and port are always allowed, even with allow_private_endpoints off, e.g. an in-cluster LLM gateway

# LLM providers, the default judge and the API keys of shared agents and remote evaluators
# live in the database. Set them after the first start:
#   evalkit llm-providers create openai --base-url https://api.openai.com/v1 --api-key-env OPENAI_API_KEY
#   evalkit judge-default set --provider openai --model gpt-5
#   evalkit agents edit ouragent@dev --api-key-env OURAGENT_DEV_KEY
