site_name: Evalkit
site_description: Make your AI agent better, end to end.
site_url: https://inferedge-ai.github.io/evalkit/
repo_url: https://github.com/inferedge-ai/evalkit
repo_name: inferedge-ai/evalkit
edit_uri: edit/develop/docs/user/
docs_dir: docs/user
strict: true

theme:
  name: material
  custom_dir: docs/site/overrides
  favicon: favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/evalkit.css

hooks:
  - docs/site/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_bases: false
            show_if_no_docstring: false

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Get started:
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - Try locally: try-locally.md
      - Install: install.md
      - Login: login.md
      - Config: config.md
      - Workspaces: workspaces.md
  - Traces:
      - SDK runs: sdk-runs.md
      - Tracing: tracing.md
      - Mappings: mappings.md
  - Harness API: harness-api.md
  - MCP: mcp.md
  - SDK reference: sdk-reference.md
